# Las dos APIs comparten un volumen. History lo monta en solo lectura.
# Las imágenes se bajan de Docker Hub (docker compose pull). Con --build se construyen
# desde el código; el frontend necesita el repo eventsourcingfrontend al lado de este.
# Los valores de Grafana salen del .env de esta carpeta o del entorno, y no entran en la imagen.

name: eventsourcing

x-otel: &otel
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local}

services:
  transaction-api:
    image: ${DOCKERHUB_USER:-mdm2510}/eventsourcing-transaction-api:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      <<: *otel
      PORT: "3000"
      NODE_ENV: production
      EVENT_STORE_FILE: /app/data/event-store.jsonl
      OTEL_SERVICE_NAME: eventsourcing-transaction-api
    volumes:
      - event-store:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/transactions').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  history-api:
    image: ${DOCKERHUB_USER:-mdm2510}/eventsourcing-history-api:${TAG:-latest}
    build:
      context: .
      dockerfile: history/Dockerfile
    ports:
      - "3001:3001"
    environment:
      <<: *otel
      PORT: "3001"
      NODE_ENV: production
      EVENT_STORE_FILE: /data/event-store.jsonl
      OTEL_SERVICE_NAME: eventsourcing-history-api
    volumes:
      - event-store:/data:ro
    restart: unless-stopped
    depends_on:
      transaction-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/history/transactions').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  frontend:
    image: ${DOCKERHUB_USER:-mdm2510}/eventsourcing-frontend:${TAG:-latest}
    build:
      context: ../eventsourcingfrontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://transaction-api:3000
      HISTORY_PROXY_TARGET: http://history-api:3001
    restart: unless-stopped
    depends_on:
      transaction-api:
        condition: service_healthy
      history-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  event-store:
