# Las dos APIs comparten un volumen. History lo monta en solo lectura.
# El .env de Grafana se inyecta al arrancar y no entra en la imagen.
# DOCKERHUB_USER, si existe, cambia el nombre con el que se etiquetan las imágenes.

name: eventsourcing

services:
  transaction-api:
    image: ${DOCKERHUB_USER:-eventsourcing}/transaction-api:etapa5
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      EVENT_STORE_FILE: /app/data/event-store.jsonl
      OTEL_SERVICE_NAME: eventsourcing-transaction-api
    env_file:
      - path: .env
        required: false
    volumes:
      - event-store:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/transactions').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  history-api:
    image: ${DOCKERHUB_USER:-eventsourcing}/history-api:etapa5
    build:
      context: .
      dockerfile: history/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      NODE_ENV: production
      EVENT_STORE_FILE: /data/event-store.jsonl
      OTEL_SERVICE_NAME: eventsourcing-history-api
    env_file:
      - path: .env
        required: false
    volumes:
      - event-store:/data:ro
    depends_on:
      transaction-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/history/transactions').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  frontend:
    image: ${DOCKERHUB_USER:-eventsourcing}/frontend:etapa5
    build:
      context: ../eventsourcingfrontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
        VITE_HISTORY_API_URL: http://localhost:3001
        VITE_API_BASE_URL: http://localhost:3000
        VITE_OTEL_ENABLED: "true"
    ports:
      - "5173:5173"
    depends_on:
      transaction-api:
        condition: service_healthy
      history-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  event-store:
